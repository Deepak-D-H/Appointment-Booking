services:
  # Backend Web Service
  - type: web
    name: medicare-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CURRENCY
        value: inr
      - key: CLIENT_SITE_URL
        fromService:
          type: web
          name: medicare-frontend
          property: url

  # Frontend Static Site
  - type: web
    name: medicare-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: medicare-backend
          property: url
      - key: VITE_CLOUD_NAME
        value: dwdijxewl
      - key: VITE_UPLOAD_PRESET
        value: doctor-booking-system
